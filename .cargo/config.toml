# Cross-compiling to Windows from Linux:
#
#   rustup target add x86_64-pc-windows-gnu
#   sudo apt-get install gcc-mingw-w64-x86-64
#   cargo build --release --target x86_64-pc-windows-gnu
#
# rustc already defaults to `x86_64-w64-mingw32-gcc` for that target, so no
# linker entry is required when the toolchain is on PATH. If yours lives
# somewhere else, uncomment and point at it:
#
# [target.x86_64-pc-windows-gnu]
# linker = "x86_64-w64-mingw32-gcc"
