[package]
name = "shitstorm-2126"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", default-features = false, features = ["2d", "ui"] }
fastrand = "2"
vleue_navigator = { version = "=0.16.0", default-features = false }

[profile.dev]
opt-level = 1
debug = false

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
